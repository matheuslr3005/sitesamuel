<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — La Torre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <nav class="navbar container">
      <a href="index.html" class="brand">
        <span class="brand-mark">LT</span>
        <span>
          La Torre
          <span class="brand-sub">Guia Gastronômico</span>
        </span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Início</a></li>
        <li><a href="index.html#restaurantes">Restaurantes</a></li>
      </ul>
    </nav>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <span class="brand-mark" style="display:flex; width:48px; height:48px; font-size:1.3rem;">LT</span>
      <div class="auth-head">
        <h1>Bem-vindo de volta</h1>
        <p>Entre para gerenciar seus restaurantes favoritos.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-error"></div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required />
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <div class="auth-foot">
        Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; <span id="year"></span> La Torre. Todos os direitos reservados.
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
