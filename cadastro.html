<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — La Torre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <nav class="navbar container">
      <a href="index.html" class="brand">
        <img src="img/logo.jpg" alt="La Torre" class="brand-mark" />
        <span>
          La Torre
          <span class="brand-sub">Guia Gastronômico</span>
        </span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Início</a></li>
        <li><a href="index.html#restaurantes">Restaurantes</a></li>
      </ul>
    </nav>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <img src="img/logo.jpg" alt="La Torre" class="brand-mark" />
      <div class="auth-head">
        <h1>Crie sua conta</h1>
        <p>Cadastre-se para adicionar e gerenciar restaurantes no guia.</p>
      </div>

      <form id="register-form" novalidate>
        <div class="form-error"></div>
        <div class="form-success"></div>
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" required />
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required />
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required />
        </div>
        <div class="form-group">
          <label for="confirmarSenha">Confirmar senha</label>
          <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
      </form>

      <div class="auth-foot">
        Já tem uma conta? <a href="login.html">Entrar</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; <span id="year"></span> La Torre. Todos os direitos reservados.
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
